name: pejabat_hr
description: Pejabat HR - aplikasi mudah alih HR untuk SME Malaysia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
