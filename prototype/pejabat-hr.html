<title>Pejabat HR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a quiet working tool. White navigation column with hairline divider, a plain top bar, and content cards separated by 1px borders rather than shadows. One blue for action and selection; orange, green and red only carry status. Rounded (Flutter M3) controls: stadium buttons, 14px fields, 16px cards. Phones get a bottom navigation bar and bottom sheets. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#f2f4f7; --ink:#101828; --muted:#475467; --faint:#98a2b3; --line:#e4e7ec; --line-2:#d0d5dd;
  --brand:#1f5bd8; --brand-hover:#1a4fbf; --brand-ink:#ffffff; --brand-soft:#ebf1fd; --brand-on-soft:#163f99;
  --accent:#f79009; --accent-ink:#2b1700;
  --ok:#067647; --ok-bg:#ecfdf3; --warn:#b54708; --warn-bg:#fffaeb; --bad:#b42318; --bad-bg:#fef3f2;
  --shadow-pop:0 12px 32px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);
  --f-head:"Plus Jakarta Sans",system-ui,sans-serif; --f-body:"Plus Jakarta Sans",system-ui,sans-serif; --f-num:"Plus Jakarta Sans",system-ui,sans-serif;
  --r:16px; --r-sm:12px;
  --c-blue:var(--brand); --c-orange:var(--accent); --c-purple:var(--brand); --c-teal:var(--brand); --c-green:var(--brand); --c-sky:var(--brand); --c-pink:var(--brand); --c-amber:var(--brand); --c-emerald:var(--ok); --c-indigo:var(--brand); --c-red:var(--bad); --c-violet:var(--brand); --c-brown:var(--brand); --c-slate:var(--brand);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c111d; --panel:#141a26; --panel-2:#1c2432; --ink:#f0f3f8; --muted:#a6b0c2; --faint:#6f7a8f; --line:#252e3d; --line-2:#344054;
  --brand:#7aa2ff; --brand-hover:#9ab8ff; --brand-ink:#08183d; --brand-soft:#17264a; --brand-on-soft:#cfdcff;
  --accent:#fdb022; --ok:#47cd89; --ok-bg:#0b2b1d; --warn:#fdb022; --warn-bg:#33240a; --bad:#f97066; --bad-bg:#3a1512;
  --shadow-pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111d; --panel:#141a26; --panel-2:#1c2432; --ink:#f0f3f8; --muted:#a6b0c2; --faint:#6f7a8f; --line:#252e3d; --line-2:#344054;
  --brand:#7aa2ff; --brand-hover:#9ab8ff; --brand-ink:#08183d; --brand-soft:#17264a; --brand-on-soft:#cfdcff;
  --accent:#fdb022; --ok:#47cd89; --ok-bg:#0b2b1d; --warn:#fdb022; --warn-bg:#33240a; --bad:#f97066; --bad-bg:#3a1512;
  --shadow-pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.015em;font-weight:700}
h1{font-size:24px} h2{font-size:15px} h3{font-size:13.5px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* navigation column */
.rail{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1px;padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.brand .mk,.mobile-brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.grp{font-size:12px;color:var(--faint);font-weight:600;padding:16px 10px 4px}
.rail button{all:unset;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-weight:500;color:var(--muted)}
.rail button .ni{display:grid;place-items:center;color:var(--faint)}
.rail button:hover{background:var(--panel-2);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-on-soft);font-weight:600}
.rail button[aria-current="page"] .ni{color:var(--brand)}
.rail button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:19px;font-variant-numeric:tabular-nums}

/* bottom navigation (phones) */
.bnav{display:none}
.bnav button{all:unset;cursor:pointer;position:relative;flex:1;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 0 6px}
.bnav button .pillx{width:56px;height:30px;border-radius:99px;display:grid;place-items:center}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav button[aria-current="page"] .pillx{background:var(--brand-soft);color:var(--brand)}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 8px);margin:0;font-size:10px;line-height:16px;padding:0 5px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-height:61px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.mobile-brand{display:none}
.search{position:relative;flex:1 1 160px;min-width:120px;max-width:400px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding:9px 14px 9px 40px;border-radius:99px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden;z-index:20;padding:4px}
.results button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:10px}
.results button:hover,.results button:focus-visible{background:var(--panel-2)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.me select{max-width:220px;border-radius:99px;padding:7px 12px;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;flex:none}
.av.lg{width:52px;height:52px;font-size:17px}
.me .who{display:grid;line-height:1.25;text-align:right;margin-left:4px}
.me .who b{font-size:13px;font-weight:600} .me .who span{font-size:12px;color:var(--muted)}
.icon-b{width:38px;height:38px;padding:0!important;justify-content:center}
main{padding-block:24px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start;min-width:0;max-width:1320px;width:100%}

/* building blocks */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sub{color:var(--muted);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.flat{background:var(--panel-2);border-color:transparent}
.card>h2+*,.card>.ch+*{margin-top:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
/* summary strip: several figures in one card, divided by hairlines */
.card.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);padding:0;overflow:hidden}
.strip>.stat{background:var(--panel);padding:16px 20px;min-width:0}
button.stat{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);padding:16px 20px;display:grid;gap:2px;align-content:start}
button.stat:hover{background:var(--panel-2)}
button.stat:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.stat{display:grid;gap:2px;align-content:start}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:24px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v.sm{font-size:18px}
.stat .n{color:var(--muted);font-size:12.5px;font-weight:500;letter-spacing:0}
.stat .v .n{font-size:14px;font-weight:500}
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.tw{overflow-x:auto;margin-inline:-20px;padding-inline:20px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.r,th.r{text-align:right;white-space:nowrap}
.person{display:flex;align-items:center;gap:10px;min-width:160px}
.person b{display:block;font-weight:600;white-space:nowrap}
.person span:not(.av){font-size:12.5px;color:var(--muted)}
.link{all:unset;cursor:pointer;color:inherit} .link:hover b{color:var(--brand)}
.link.person{display:flex;gap:10px;align-items:center;min-width:160px}
.tlink{all:unset;cursor:pointer;color:var(--brand);font-weight:600;font-size:13px}
.tlink:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;line-height:18px}
.pill .ic{width:13px;height:13px}
.p-pending{background:var(--warn-bg);color:var(--warn)} .p-approved{background:var(--ok-bg);color:var(--ok)} .p-rejected{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--brand-soft);color:var(--brand-on-soft)} .p-mute{background:var(--panel-2);color:var(--muted)}
.b{font:inherit;font-weight:600;font-size:13.5px;border-radius:99px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;position:relative;overflow:hidden;transition:background .15s,border-color .15s,transform .1s}
.b:hover{background:var(--panel-2)}
.b:active{transform:scale(.98)}
.b.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.b.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.b.ghost{background:transparent;border-color:transparent}
.b.ghost:hover{background:var(--panel-2)}
.b.sm{padding:5px 12px;font-size:12.5px}
.b.ok{color:var(--ok)} .b.no{color:var(--bad)}
.b.ok:hover{background:var(--ok-bg);border-color:transparent} .b.no:hover{background:var(--bad-bg);border-color:transparent}
.b.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.b:disabled{opacity:.45;cursor:not-allowed}
.b .ic{width:16px;height:16px}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:rip .45s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
:is(.b,input,select,textarea,.link,.chip,.tlink):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* segmented filter */
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--panel-2);padding:3px;border-radius:99px}
.chip{all:unset;cursor:pointer;position:relative;overflow:hidden;font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.chip .c{color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.chips.free{background:none;padding:0;gap:8px}
.chips.free .chip{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-weight:500}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px;align-items:start}
.full{grid-column:1/-1}
.fld{display:grid;gap:6px} .fld>span{font-size:13px;color:var(--ink);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);padding:0;box-shadow:none}
textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)} .hint.warn{color:var(--warn)} .hint.bad{color:var(--bad)}
.quiet{color:var(--muted);margin:0;padding:6px 0}
.empty{color:var(--muted);text-align:center;padding:28px 12px;display:grid;gap:4px;justify-items:center}
.empty>.ic{width:22px;height:22px;color:var(--faint);margin-bottom:4px}
.empty b{color:var(--ink);font-weight:600}
.empty .b{margin-top:8px}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:12px;padding:10px 14px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);max-width:90ch}
.list{display:grid}
.list>div{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list>div:first-child{padding-top:2px}
.list>div:last-child{border-bottom:0;padding-bottom:0}
.list>div>.ic{color:var(--faint)}
.list .grow{flex:1;min-width:0}
.list .grow b{font-weight:600}
.ann{display:grid;gap:3px;padding:12px 0;border-bottom:1px solid var(--line)}
.ann:first-child{padding-top:0}
.ann:last-child{border-bottom:0;padding-bottom:0}
.ann .t{font-weight:600;display:flex;gap:8px;align-items:center}
.ann small{color:var(--faint)}
.ann .pin{color:var(--brand);font-size:12px;font-weight:600}
/* punch card */
.punch{display:grid;grid-template-columns:auto auto 1fr;gap:28px;align-items:center}
.punch .clk{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.punch .io{display:flex;gap:24px;padding-left:28px;border-left:1px solid var(--line)}
.punch .io div{display:grid;gap:2px} .punch .io span{font-size:12.5px;color:var(--muted)} .punch .io b{font-size:18px;font-variant-numeric:tabular-nums}
.punch .pact{display:grid;justify-items:end;gap:6px;text-align:right}
.punch .pact .b.pri{padding:11px 24px;font-size:14.5px}
.bal{display:grid;gap:14px}
.bal .bk{display:flex;justify-content:space-between;font-size:13.5px}
.bal .bk b{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:7px}
.steps i{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;border:1px solid var(--line-2)}
.steps .on{color:var(--ink);font-weight:600} .steps .on i{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps .sep{width:20px;height:1px;background:var(--line-2)}
.cell-in{width:88px;text-align:right;padding:6px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;font-weight:500;background:var(--panel);padding:8px 0}
.cal .d{min-height:96px;padding:6px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;overflow:hidden;background:var(--panel)}
.cal .d.off{color:var(--faint)} .cal .d.off .ev{opacity:.5} .cal .d.we{background:var(--panel-2)}
.cal .d>b{font-weight:600;font-size:12.5px;width:24px;height:24px;display:grid;place-items:center;border-radius:99px}
.cal .d.today>b{background:var(--brand);color:var(--brand-ink)}
.cal .ev{background:var(--brand-soft);color:var(--brand-on-soft);border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal .ev.hol{background:var(--warn-bg);color:var(--warn)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:var(--shadow-pop)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
dialog::backdrop{background:rgba(16,24,40,.4)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(520px,100vw);border-radius:20px 0 0 20px;border-width:0 0 0 1px}
.dlg{padding:24px;display:grid;gap:18px}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-h h2{font-size:18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.slip{display:grid;gap:16px}
.slip .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.slip table td{padding:6px 0;border:0;background:none!important}
.slip .tot td{border-top:1px solid var(--line);font-weight:700;padding-top:9px}
.slip .net{display:flex;justify-content:space-between;align-items:center;background:var(--brand-soft);color:var(--brand-on-soft);border-radius:14px;padding:14px 18px;font-weight:600}
.slip .net b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;font-size:13.5px;z-index:60;box-shadow:var(--shadow-pop);max-width:calc(100vw - 32px);animation:toast .2s ease-out}
@keyframes toast{from{transform:translate(-50%,8px);opacity:0}}
.skel{height:14px;border-radius:99px;background:var(--panel-2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.gate{max-width:500px;margin:8vh auto 0}
.bellwrap{position:relative}
.bellwrap .dot{position:absolute;top:2px;right:2px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;line-height:16px;min-width:16px;border-radius:99px;text-align:center;padding:0 4px;pointer-events:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);padding:12px 16px;z-index:30}
.pop .list>div{align-items:flex-start}
.ai{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:45;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.ai-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}

/* =========================================================
   Malaysian statutory contributions (estimates)
   ========================================================= */
const up05=n=>Math.ceil(Math.round(n*1000)/50)/20;
function statutory(gross){
  const g=Math.max(0,gross);
  // KWSP Jadual Ketiga: upah dibundarkan ke atas ke RM20 (<=RM5,000) atau RM100 (>RM5,000); caruman dibundarkan ke ringgit
  const ew=g<=10?0:g<=5000?Math.ceil(g/20)*20:Math.ceil(g/100)*100;
  const epfEe=Math.ceil(ew*0.11), epfEr=Math.ceil(ew*(g<=5000?0.13:0.12));
  // PERKESO & SIP: jadual ikut bracket RM100, dikira pada titik tengah bracket, siling RM6,000
  const sw=g<=0?0:g>=6000?6000:g<=30?g:Math.ceil(g/100)*100-50;
  const socsoEe=up05(sw*0.005), socsoEr=up05(sw*0.0175), eisEe=up05(sw*0.002), eisEr=up05(sw*0.002);
  const chargeable=Math.max(0,g*12-Math.min(epfEe*12,4000)-9000);
  const B=[[5000,0],[20000,.01],[35000,.03],[50000,.06],[70000,.11],[100000,.19],[400000,.25],[600000,.26],[2000000,.28],[Infinity,.30]];
  let tax=0,prev=0;for(const[c,rate]of B){if(chargeable>prev)tax+=(Math.min(chargeable,c)-prev)*rate;prev=c}
  if(chargeable<=35000)tax=Math.max(0,tax-400);
  return{epfEe,epfEr,socsoEe,socsoEr,eisEe,eisEr,pcb:Math.max(0,Math.floor(tax/12*20)/20)};
}

/* =========================================================
   Data store: shared db, or in-memory demo
   ========================================================= */
function memStore(){
  const M={},subs=[];const col=c=>M[c]||(M[c]=new Map());
  const fire=c=>subs.filter(s=>s.c===c).forEach(s=>s.id?s.cb(col(c).has(s.id)?{id:s.id,...col(c).get(s.id)}:null):s.cb([...col(c)].map(([id,d])=>({id,...d}))));
  return{
    async add(c,d){const id="m"+Math.random().toString(36).slice(2,9);col(c).set(id,structuredClone(d));fire(c);return id},
    async set(c,id,d){col(c).set(id,structuredClone(d));fire(c)},
    async update(c,id,p){col(c).set(id,{...(col(c).get(id)||{}),...structuredClone(p)});fire(c)},
    async del(c,id){col(c).delete(id);fire(c)},
    watchCol(c,cb){subs.push({c,cb});fire(c)},
    watchDoc(c,id,cb){subs.push({c,id,cb});fire(c)}
  };
}
function dbStore(db){
  return{
    async add(c,d){return (await db.collection(c).add(d)).id},
    async set(c,id,d){await db.collection(c).doc(id).set(d)},
    async update(c,id,p){await db.collection(c).doc(id).update(p)},
    async del(c,id){await db.collection(c).doc(id).delete()},
    watchCol(c,cb,err){db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err)},
    watchDoc(c,id,cb,err){db.collection(c).doc(id).onSnapshot(s=>cb(s.exists?{id:s.id,...s.data()}:null),err)}
  };
}

const actorId=()=>SES.admin?(SES.preview==="admin"?null:SES.preview):myEmp()?.id||null;
const asAdmin=()=>SES.admin&&SES.preview==="admin";
const mine=arr=>asAdmin()?arr:arr.filter(x=>x.empId===actorId());
const byNew=(a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"");

function isWorkday(k){const d=new Date(k+"T00:00").getDay();const we=cfg().weekend==="frisat"?[5,6]:[0,6];return !we.includes(d)&&!cfg().holidays.some(h=>h.date===k)}
function workdays(a,b){if(!a||!b||b<a)return 0;let d=new Date(a+"T00:00"),e=new Date(b+"T00:00"),n=0;while(d<=e){if(isWorkday(ymd(d)))n++;d.setDate(d.getDate()+1)}return n}
function workdaysInMonth(a,b,month){const s=month+"-01",e=ymd(new Date(+month.slice(0,4),+month.slice(5),0));return workdays(a>s?a:s,b<e?b:e)}

const LEAVE=[{t:"Cuti Tahunan",k:"leaveAnnual"},{t:"Cuti Sakit",k:"leaveMedical"},{t:"Cuti Kecemasan"},{t:"Cuti Tanpa Gaji"},{t:"Cuti Bersalin"},{t:"Cuti Paterniti"}];
function usedLeave(id,type,yr){return S.leaves.filter(l=>l.empId===id&&l.type===type&&l.status==="approved"&&(l.from||"").startsWith(yr)).reduce((n,l)=>n+(+l.days||0),0)}
function pendingLeave(id,type,yr){return S.leaves.filter(l=>l.empId===id&&l.type===type&&l.status==="pending"&&(l.from||"").startsWith(yr)).reduce((n,l)=>n+(+l.days||0),0)}
function balance(id,type){const e=emp(id),L=LEAVE.find(x=>x.t===type);if(!e||!L?.k)return null;return (+e[L.k]||0)-usedLeave(id,type,today().slice(0,4))}

/* payroll */
function orpHourly(id){return (+S.hr[id]?.salary||0)/26/8}
function otPay(o){return r2(orpHourly(o.empId)*(+o.rate||1.5)*(+o.hours||0))}
function computeLine(e,month){
  const hr=S.hr[e.id]||{},adj=S.payadj[`${month}_${e.id}`]||{};
  const basic=+hr.salary||0, allowance=+hr.allowance||0, bonus=+adj.bonus||0, otherDed=+adj.otherDed||0;
  const ot=r2(S.overtime.filter(o=>o.empId===e.id&&o.status==="approved"&&(o.date||"").startsWith(month)).reduce((n,o)=>n+otPay(o),0));
  const claim=r2(S.claims.filter(c=>c.empId===e.id&&c.status==="approved"&&(c.date||"").startsWith(month)).reduce((n,c)=>n+(+c.amount||0),0));
  const unpaidDays=S.leaves.filter(l=>l.empId===e.id&&l.type==="Cuti Tanpa Gaji"&&l.status==="approved").reduce((n,l)=>n+(l.from===l.to?(l.from.startsWith(month)?+l.days||0:0):workdaysInMonth(l.from,l.to,month)),0);
  const unpaid=r2(basic/26*unpaidDays);
  const gross=r2(basic+allowance+ot+bonus-unpaid), st=statutory(gross);
  const ded=r2(st.epfEe+st.socsoEe+st.eisEe+st.pcb+otherDed);
  return{empId:e.id,name:e.name,ic:hr.ic||"",position:e.position||"",dept:e.dept||"",bank:hr.bank||"",bankAcc:hr.bankAcc||"",
    basic,allowance,ot,bonus,unpaid,unpaidDays,gross,...st,otherDed,ded,claim,net:r2(gross-ded+claim)};
}
const run=m=>S.payruns.find(p=>p.id===m);
function slipFor(empId,month){
  if(SES.admin){const r=run(month);return r?r.lines.find(l=>l.empId===empId):null}
  return S.mySlip?.slips?.[month]||null;
}
function slipMonths(empId){
  if(SES.admin)return S.payruns.filter(r=>r.lines.some(l=>l.empId===empId)).map(r=>r.id).sort().reverse();
  return Object.keys(S.mySlip?.slips||{}).sort().reverse();
}

  return `<div class="card punch"><div><div class="clk" id="clk">${nowHM()}</div><div class="hint" style="margin-top:6px">${longDate(t)}</div></div>

function reqDetail(k,r){

function tenure(d){if(!d)return"";const a=new Date(d+"T00:00"),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(m<0)return"Belum mula";const y=Math.floor(m/12);m%=12;return [y?y+" thn":"",m?m+" bln":""].filter(Boolean).join(" ")||"Baru"}
function entitlementFor(joinDate){const y=(Date.now()-new Date((joinDate||today())+"T00:00"))/(365.25*864e5);return y<2?[8,14]:y<5?[12,18]:[16,22]}

  }

function updateLeaveCalc(){

  const t=$("#r_type").value,a=$("#r_from").value,b=$("#r_to").value,half=$("#r_half")?.value||"",n=leaveDays(a,b,half),bal=balance(actorId(),t);
  const overlap=S.leaves.some(l=>l.empId===actorId()&&l.status!=="rejected"&&l.from<=b&&l.to>=a);

  let msg=b<a?`<span class="hint bad">Tarikh “Hingga” mesti sama atau selepas “Dari”.</span>`:halfBad?`<span class="hint bad">Separuh hari hanya untuk satu tarikh. Samakan “Dari” dan “Hingga”.</span>`:`<b>${n} hari bekerja</b>${n===0?" · tarikh ini hari rehat atau cuti umum":""}`;

/* ---- Charts ---- */
function niceMax(m){if(m<=0)return 1;const p=10**Math.floor(Math.log10(m)),f=m/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function vbar(data,{fmt=v=>v,unit="",h=200,max}={}){
  if(!data.length)return"";
  const W=640,H=h,L=46,R=8,T=10,Bm=26,iw=W-L-R,ih=H-T-Bm,top=max||niceMax(Math.max(...data.map(d=>d.v))),step=iw/data.length,bw=Math.max(4,Math.min(36,step*.62));
  const ticks=[0,.25,.5,.75,1].map(f=>f*top);const every=Math.ceil(data.length/10);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta bar">
   ${ticks.map(t=>{const y=T+ih-(t/top)*ih;return `<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${esc(fmt(t,true))}</text>`}).join("")}
   ${data.map((d,i)=>{const x=L+i*step+(step-bw)/2,bh=Math.max(d.v>0?2:0,(d.v/top)*ih),y=T+ih-bh,r=Math.min(4,bw/2,bh);
     return `<g data-tip="${esc(d.l+": "+fmt(d.v)+unit)}"><rect class="hit" x="${L+i*step}" y="${T}" width="${step}" height="${ih}"/>${bh?`<path class="m" d="M${x},${T+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${T+ih}Z"/>`:""}
     ${i%every===0?`<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.s||d.l)}</text>`:""}</g>`}).join("")}
  </svg>`;
}
function hbar(data,fmt=v=>v){
  if(!data.length)return"";const m=Math.max(...data.map(d=>d.v),1);
  return `<div class="hb">${data.map(d=>`<span class="lb" title="${esc(d.l)}">${esc(d.l)}</span><span class="tr" data-tip="${esc(d.l+": "+fmt(d.v))}"><i style="width:${d.v/m*100}%"></i></span><span class="num">${esc(fmt(d.v))}</span>`).join("")}</div>`;
}
const tableOf=(heads,rows)=>`<details><summary>Lihat jadual</summary><div class="tw"><table><thead><tr>${heads.map((h,i)=>`<th class="${i?"r":""}">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?"r num":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;

function insights({avgAtt,late,emps}){

function aiSystem(){
  const c=cfg(),A=asAdmin(),e=emp(actorId());
  return `Anda pembantu HR dalam sistem "Pejabat HR" untuk syarikat ${c.name||"pengguna"} di Malaysia. Hari ini ${longDate(today())} (${today()}).
Pengguna: ${A?"Admin HR (boleh lihat semua data pekerja)":`pekerja bernama ${e?.name}, jawatan ${e?.position||"-"}. Mereka hanya boleh lihat data sendiri; jangan dedahkan data pekerja lain.`}
Peraturan:
- Gunakan alat untuk sebarang angka atau fakta tentang data syarikat. Jangan reka angka. Jika data tiada, katakan.
- Jawab dalam bahasa soalan (biasanya Bahasa Melayu), ringkas dan mesra. Gunakan senarai "- " bila perlu dan **tebal** untuk angka penting. Tiada jadual markdown, tiada tajuk.
- Tarikh relatif ("Jumaat ini", "minggu ini", "bulan lepas") dikira daripada tarikh hari ini.
${A?"":"- Jika pengguna mahu memohon cuti, panggil buka_borang_cuti dengan butiran, kemudian beritahu mereka semak borang dan tekan Hantar. Anda tidak boleh menghantar sendiri.\n"}- Untuk soalan undang-undang, beri ringkasan dan cadangkan semak dengan Jabatan Tenaga Kerja (JTK) atau peguam untuk kes khusus.
Ringkasan Akta Kerja 1955 (pindaan 2022) dan caruman:
- Waktu kerja biasa maksimum 45 jam seminggu. OT: 1.5× hari biasa, 2× hari rehat, 3× cuti umum; had OT 104 jam sebulan. ORP = gaji bulanan ÷ 26.
- Cuti tahunan: 8 hari (<2 tahun), 12 hari (2–5 tahun), 16 hari (>5 tahun). Cuti sakit: 14/18/22 hari; cuti hospital hingga 60 hari setahun.
- Cuti bersalin 98 hari. Cuti paterniti 7 hari berturut-turut untuk pekerja lelaki berkahwin (khidmat sekurang-kurangnya 12 bulan, hingga 5 kelahiran).
- Sekurang-kurangnya 11 hari cuti umum bergaji setahun, termasuk 5 yang diwajibkan (Hari Kebangsaan, Hari Keputeraan YDPA, Hari Keputeraan Raja/Hari Wilayah, Hari Pekerja, Hari Malaysia).
- KWSP: pekerja 11%, majikan 13% (gaji ≤RM5,000) atau 12%. PERKESO dan SIP: siling gaji RM6,000. PCB dipotong setiap bulan. Borang EA mesti diberi kepada pekerja sebelum 28 Februari.
- Gaji mesti dibayar tidak lewat dari hari ke-7 bulan berikutnya. Gaji minimum RM1,700 sebulan.`;
}
async function askAI(q){
  if(AI.busy||!SES.sample)return;
  AI.msgs.push({role:"user",content:q});const ans={role:"assistant",content:""};AI.msgs.push(ans);AI.busy=true;renderAI();
  const conv=AI.msgs.filter(m=>m.role==="user"||(m.role==="assistant"&&m!==ans&&m.content));
  const input=conv.map((m,i)=>({role:m.role,content:i===0?aiSystem()+"\n\nSoalan pengguna:\n"+m.content:m.content}));
  if(input.length&&input[input.length-1].role==="user"&&input.length>1)input[input.length-1]={role:"user",content:`(Konteks: ${aiSystem().split("\n")[1]})\n${q}`};
  AI.ctl=new AbortController();
  try{
    const r=await SES.sample(input,{tools:aiTools(),signal:AI.ctl.signal,cache:false,modelTier:"default",onText:({text})=>{ans.content=text;const l=$("#aiLog .msg.a:last-child");if(l){l.innerHTML=md(text);$("#aiLog").scrollTop=1e9}else renderAI()}});
    ans.content=r?.text||ans.content;
  }catch(e){
    if(e?.text)ans.content=e.text;
    if(e?.code!=="cancelled"){const m={not_granted:"Pembantu AI tidak dibenarkan untuk paparan ini. Anda boleh benarkan melalui menu Permissions halaman.",rate_limited:"Terlalu banyak soalan dalam masa singkat. Cuba lagi sebentar.",quota_exceeded:"Had penggunaan AI telah dicapai buat masa ini."}[e?.code]||"Pembantu AI tidak dapat menjawab sekarang. Cuba lagi.";AI.msgs.push({role:"error",content:m})}
    if(!ans.content)AI.msgs.splice(AI.msgs.indexOf(ans),1);
  }
  AI.busy=false;AI.ctl=null;renderAI();setTimeout(()=>$("#aiIn")?.focus(),20);
}

    case "attDel":await save(()=>store.del("attendance",`${id}_${UI.attDate}`),"Rekod dipadam");dlg.close();break;
    case "req":openDlg(reqDialog(b.dataset.k));if(b.dataset.k==="leave")updateLeaveCalc();break;
    case "decide":await decide(col,id,b.dataset.s);toast(b.dataset.s==="approved"?"Diluluskan":"Ditolak");UI.sel.delete(id);break;
    case "bulk":{const ids=[...UI.sel],s=b.dataset.s;for(const x of ids)await decide(UI.inbox,x,s);UI.sel.clear();toast(`${ids.length} permohonan ${s==="approved"?"diluluskan":"ditolak"}`);break}
    case "bell":UI.bell=!UI.bell;if(UI.bell)markSeen();renderTop();break;
    case "notifGo":UI.bell=false;UI.view=b.dataset.k==="leaves"?"leave":b.dataset.k==="claims"?"claim":b.dataset.k==="overtime"?"ot":b.dataset.k;UI.filter="all";render();break;
    case "expAudit":download("log-audit.csv",toCSV([["Masa (UTC)","Oleh","Tindakan","Butiran"],...[...S.audit].sort((a,b)=>(a.at||"").localeCompare(b.at||"")).map(r=>[r.at,names[r.by]||r.by,r.action,r.detail])]));break;
    case "more":openDlg(moreSheet());break;
    case "aiOpen":UI.ai=true;renderAI();setTimeout(()=>$("#aiIn")?.focus(),30);break;
    case "aiClose":UI.ai=false;renderAI();break;
    case "aiSugg":askAI(b.dataset.q);break;
    case "aiStop":AI.ctl?.abort();break;
    case "aiClear":AI.msgs=[];renderAI();break;
    case "docDel":{const d=S.docs.find(x=>x.id===id);if(await confirmBox("Buang dokumen?",`“${esc(d?.title)}” akan dibuang untuk semua pekerja.`,"Buang")){await save(()=>store.del("docs",id),"Dokumen dibuang");audit("Buang dokumen",d?.title||"")}break}
    case "inboxGo":UI.bell=false;UI.view="inbox";UI.inbox=b.dataset.k;UI.sel.clear();render();break;
    case "withdraw":if(await confirmBox("Tarik balik permohonan?","Permohonan ini akan dipadam.","Tarik balik")){await save(()=>store.del(col,id),"Permohonan ditarik balik");audit("Tarik balik permohonan",`${col} ${id}`)}break;
    case "linkOk":await approveLink(id);break;
    case "linkNo":await save(()=>store.del("links",id),"Permintaan ditolak");break;
    case "linkCancel":await save(()=>store.del("links",SES.uid),"Permintaan dibatalkan");break;
    case "payShift":UI.payMonth=addMonth(UI.payMonth,+b.dataset.n);render();break;
    case "run":await finalize();break;
    case "unrun":await unfinalize();break;
    case "slip":{const m=b.dataset.m||UI.payMonth;const l=slipFor(id,m)||(SES.admin&&emp(id)?computeLine(emp(id),m):null);if(l)openDlg(slipHTML(l,m));break}
    case "dlSlip":{const m=b.dataset.m;const l=slipFor(id,m)||(SES.admin&&emp(id)?computeLine(emp(id),m):null);if(l)download(`slip-gaji-${l.name.replace(/\W+/g,"-").toLowerCase()}-${m}.html`,slipFile(l,m),"text/html");break}
    case "expPay":{const m=UI.payMonth,ls=run(m)?.lines||active().map(e=>computeLine(e,m));download(`gaji-${m}.csv`,toCSV([["Nama","No KP","Jawatan","Gaji pokok","Elaun","OT","Bonus","Potongan tanpa gaji","Gaji kasar","KWSP pekerja","KWSP majikan","PERKESO pekerja","PERKESO majikan","SIP pekerja","SIP majikan","PCB","Potongan lain","Tuntutan","Gaji bersih"],...ls.map(l=>[l.name,l.ic,l.position,l.basic,l.allowance,l.ot,l.bonus,l.unpaid,l.gross,l.epfEe,l.epfEr,l.socsoEe,l.socsoEr,l.eisEe,l.eisEr,l.pcb,l.otherDed,l.claim,l.net])]));break}
    case "expBank":{const m=UI.payMonth,ls=run(m)?.lines||active().map(e=>computeLine(e,m));download(`bayaran-bank-${m}.csv`,toCSV([["Nama penerima","Bank","No akaun","Jumlah (RM)","Rujukan"],...ls.map(l=>[l.name,l.bank,l.bankAcc,l.net.toFixed(2),`GAJI ${m}`])]));break}
    case "expStat":{const m=UI.payMonth,ls=run(m)?.lines||active().map(e=>computeLine(e,m));download(`caruman-${m}.csv`,toCSV([["Nama","No KP","Upah","KWSP pekerja","KWSP majikan","PERKESO pekerja","PERKESO majikan","SIP pekerja","SIP majikan","PCB"],...ls.map(l=>[l.name,l.ic,l.gross,l.epfEe,l.epfEr,l.socsoEe,l.socsoEr,l.eisEe,l.eisEr,l.pcb])]));break}
    case "expEmp":download("pekerja.csv",toCSV([["Nama","Jawatan","Jabatan","Mula kerja","Status","Emel","No KP","Telefon","Gaji pokok","Elaun","Bank","No akaun","No KWSP","TIN"],...S.employees.map(e=>{const h=S.hr[e.id]||{};return[e.name,e.position,e.dept,e.joinDate,e.status,e.email,h.ic,h.phone,h.salary,h.allowance,h.bank,h.bankAcc,h.epfNo,h.taxNo]})]));break;
    case "expAtt":{const m=UI.attDate.slice(0,7);download(`kehadiran-${m}.csv`,toCSV([["Tarikh","Nama","Masuk","Keluar","Jam"],...S.attendance.filter(a=>a.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date)).map(a=>[a.date,empName(a.empId),a.in,a.out,a.out?hoursBetween(a.in,a.out).toFixed(2):""])]));break}
    case "expEA":{const rows=[];S.payruns.filter(p=>p.id.startsWith(UI.eaYear)).forEach(r=>r.lines.forEach(l=>rows.push(l)));const agg={};rows.forEach(l=>{const a=agg[l.empId]||(agg[l.empId]=[l.name,l.ic,0,0,0,0,0,0]);a[2]+=l.gross;a[3]+=l.bonus||0;a[4]+=l.epfEe;a[5]+=l.socsoEe;a[6]+=l.eisEe;a[7]+=l.pcb});download(`ea-${UI.eaYear}.csv`,toCSV([["Nama","No KP","Saraan kasar","Bonus","KWSP","PERKESO","SIP","PCB"],...Object.values(agg).map(a=>a.map(v=>typeof v==="number"?r2(v):v))]));break}
    case "annNew":openDlg(annForm());break;
    case "annPin":{const a=S.announcements.find(x=>x.id===id);await save(()=>store.update("announcements",id,{pinned:!a.pinned}));break}
    case "annDel":if(await confirmBox("Padam pengumuman?","Pengumuman ini akan hilang untuk semua pekerja.","Padam"))await save(()=>store.del("announcements",id),"Pengumuman dipadam");break;
    case "calShift":UI.calMonth=addMonth(UI.calMonth,+b.dataset.n);render();break;
    case "calToday":UI.calMonth=thisMonth();render();break;
    case "holDel":await save(()=>store.set("settings","company",{...cfg(),holidays:cfg().holidays.filter(h=>h.date!==b.dataset.d)}),"Cuti umum dibuang");break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){UI.q=e.target.value;renderSearch()}
  if(e.target.id==="empQ"){UI.empQ=e.target.value;render()}
  if(["r_type","r_from","r_to","r_half"].includes(e.target.id)){if(e.target.id==="r_from"&&$("#r_to").value<e.target.value)$("#r_to").value=e.target.value;updateLeaveCalc()}
  if(e.target.dataset.adj)saveAdj(e.target.dataset.id,e.target.dataset.adj,e.target.value);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="preview"){SES.preview=t.value;UI.view="dash";render()}
  if(t.id==="payMonth"&&t.value){UI.payMonth=t.value;render()}
  if(t.id==="slipMonth"){UI.payMonth=t.value;render()}
  if(t.id==="attDate"&&t.value){UI.attDate=t.value;render()}
  if(t.id==="eaYear"){UI.eaYear=t.value;render()}
  if(t.dataset.adj)schedule();
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="aiIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const q=e.target.value.trim();if(q)askAI(q);return}
  if(e.key==="Escape"&&UI.q){UI.q="";const q=$("#q");if(q)q.value="";renderSearch()}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)&&$("#q")){e.preventDefault();$("#q").focus()}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,v=id=>(f.querySelector("#"+id)||{}).value??"";
  if(f.id==="fEmp"){
    const id=f.dataset.id;
    const pub={name:v("e_name").trim(),position:v("e_position").trim(),dept:v("e_dept").trim(),joinDate:v("e_joinDate"),email:v("e_email").trim(),leaveAnnual:+v("e_leaveAnnual")||0,leaveMedical:+v("e_leaveMedical")||0,status:v("e_status")};
    const priv={salary:+v("h_salary")||0,allowance:+v("h_allowance")||0,ic:v("h_ic").trim(),phone:v("h_phone").trim(),bank:v("h_bank").trim(),bankAcc:v("h_bankAcc").trim(),epfNo:v("h_epfNo").trim(),taxNo:v("h_taxNo").trim()};
    dlg.close();
    const eid=id||await save(()=>store.add("employees",{...pub,createdAt:iso()}));
    if(!eid)return;
    if(id)await save(()=>store.update("employees",id,pub));
    await save(()=>store.set("hrPrivate",typeof eid==="string"?eid:id,priv),id?"Maklumat dikemas kini":`${pub.name} ditambah`);
    if(id){const old=S.hr[id]||{};audit("Kemas kini pekerja",pub.name+(+old.salary!==priv.salary?` · gaji ${RM(old.salary)} → ${RM(priv.salary)}`:""))}else audit("Tambah pekerja",`${pub.name} · gaji ${RM(priv.salary)}`);
  }
  if(f.id==="fReq"){
    const k=f.dataset.kind,aid=actorId(),btn=$("#reqSubmit");btn.disabled=true;let d,col;
    if(k==="leave"){col="leaves";const half=v("r_half");d={type:v("r_type"),from:v("r_from"),to:v("r_to"),days:leaveDays(v("r_from"),v("r_to"),half),half:half&&v("r_from")===v("r_to")?half:"",reason:v("r_reason").trim()}}
    if(k==="claim"){col="claims";d={category:v("r_category"),date:v("r_date"),amount:r2(v("r_amount")),desc:v("r_desc").trim()};
      const file=f.querySelector("#r_file")?.files?.[0];
      if(file){if(file.size>20*1024*1024){toast("Resit melebihi 20 MB.");btn.disabled=false;return}
        btn.textContent="Memuat naik resit…";try{const a=await SES.assets.upload(file);d.receiptId=a.id}catch(err){toast("Resit tidak dapat dimuat naik. Cuba lagi atau hantar tanpa resit.");btn.disabled=false;btn.innerHTML=ic("check")+"Hantar permohonan";return}}}
    if(k==="ot"){col="overtime";const s=f.querySelector("#r_rate");d={date:v("r_date"),hours:+v("r_hours")||0,rate:+v("r_rate"),rateLabel:s.options[s.selectedIndex].text,desc:v("r_desc").trim()}}
    const ok=await save(()=>store.add(col,{...d,empId:aid,createdAt:iso()}),"Permohonan dihantar");
    if(ok)audit("Hantar permohonan",`${empName(aid)} · ${k==="leave"?d.type+" "+d.days+" hari":k==="claim"?"Tuntutan "+RM(d.amount):"OT "+d.hours+" jam"}`);
    if(ok)dlg.close();else btn.disabled=false;
  }
  if(f.id==="fAtt"){const id=f.dataset.id,key=`${id}_${UI.attDate}`;await save(()=>store.set("attendance",key,{empId:id,date:UI.attDate,in:v("t_in"),out:v("t_out"),edited:true}),"Kehadiran dibetulkan");audit("Betulkan kehadiran",`${empName(id)} · ${UI.attDate} · ${v("t_in")||"—"}–${v("t_out")||"—"}`);dlg.close()}
  if(f.id==="fAnn"){await save(()=>store.add("announcements",{title:v("a_title").trim(),body:v("a_body").trim(),pinned:f.querySelector("#a_pin").checked,createdAt:iso()}),"Pengumuman diterbitkan");audit("Terbit pengumuman",v("a_title"));dlg.close()}
  if(f.id==="fSet"){await save(()=>store.set("settings","company",{...cfg(),name:v("s_name").trim(),ssm:v("s_ssm").trim(),epfNo:v("s_epfNo").trim(),socsoNo:v("s_socsoNo").trim(),address:v("s_address").trim(),startTime:v("s_startTime")||"09:00",weekend:v("s_weekend")}),"Tetapan disimpan");audit("Kemas kini tetapan","")}
  if(f.id==="fHol"){const d=v("h_date"),n=v("h_name").trim();if(!d||!n)return;await save(()=>store.set("settings","company",{...cfg(),holidays:[...cfg().holidays.filter(h=>h.date!==d),{date:d,name:n}]}),"Cuti umum ditambah")}
  if(f.id==="fAI"){const q=v("aiIn").trim();if(q)askAI(q);return}
  if(f.id==="fDoc"){await uploadDoc(f);return}
  if(f.id==="fLink"){const id=v("l_emp");if(id)await save(()=>store.set("links",SES.uid,{empId:id,requestedAt:iso()}),"Permintaan dihantar kepada HR")}
});
document.addEventListener("pointerdown",e=>{const t=e.target.closest(".b,.chip,.tile,.rail button,.bnav button");if(!t||t.disabled||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height),sp=document.createElement("span");sp.className="rip";sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(sp);setTimeout(()=>sp.remove(),520)});
setInterval(()=>{const c=$("#clk");if(c)c.textContent=nowHM()},10000);

/* =========================================================
   Boot
   ========================================================= */
(async()=>{
  const use=n=>window.claude?.use?Promise.race([window.claude.use(n).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),10000))]):Promise.resolve(null);
  const [db,user,assets,downloads,sample]=await Promise.all([use("db"),use("user"),use("assets"),use("downloads"),use("sample")]);
  SES.assets=assets;SES.downloads=downloads;SES.user=user;SES.sample=sample;
  if(db&&user){
    SES.mode="live";
    try{SES.uid=await user.id();SES.admin=await user.canEdit();const me=await user.me();SES.name=me?.name||""}catch(_){SES.admin=false}
    store=dbStore(db);
  }else{store=memStore();SES.admin=true}
  const pending=new Set();
  const done=k=>{pending.delete(k);if(!pending.size&&!SES.loaded){SES.loaded=true;clearTimeout(timer);render()}else schedule()};
  const timer=setTimeout(()=>{SES.loaded=true;render()},10000);
  renderAI();
  const err=k=>e=>{done(k);if(e?.code!=="not_granted")toast("Tak dapat baca data. Muat semula halaman jika masalah berterusan.")};
  const col=(c,set)=>{pending.add(c);store.watchCol(c,rows=>{set(rows);done(c)},err(c))};
  const doc=(c,id,set)=>{const k=c+"/"+id;pending.add(k);store.watchDoc(c,id,d=>{set(d);done(k)},err(k))};
  col("employees",r=>S.employees=r);
  REQCOLS.forEach(c=>col(c,r=>{S.raw[c]=r;derive()}));
  col("decisions",r=>{S.dec={};r.forEach(x=>S.dec[x.id]=x);derive()});
  col("docs",r=>S.docs=r);
  col("attendance",r=>S.attendance=r);col("announcements",r=>S.announcements=r);
  doc("settings","company",d=>{S.settings=d?{...d}:{};delete S.settings.id});
  if(SES.admin){
    col("hrPrivate",r=>{S.hr={};r.forEach(x=>S.hr[x.id]=x)});
    col("payruns",r=>S.payruns=r);
    col("payadj",r=>{const t={};r.forEach(x=>{const{id,...d}=x;t[id]=d});for(const k of dirtyAdj)t[k]=S.payadj[k];S.payadj=t});
    col("links",r=>{S.links=r;resolveNames(r.map(x=>x.id))});
    col("payslips",r=>S.payslips=r);
    col("audit",r=>{S.audit=r;resolveNames([...new Set(r.map(x=>x.by).filter(Boolean))])});
  }else if(SES.uid){
    doc("payslips",SES.uid,d=>S.mySlip=d);
    doc("links",SES.uid,d=>S.myLink=d);
  }
})();
</script>
